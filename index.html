<style>
:root{--ink:#1d2a31;--ink2:#5b6a71;--rule:#d5dbdc;--paper:#ffffff;--bg:#eef1f1;--marca:#c8202e;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);display:grid;place-items:center;padding:24px}
main{background:var(--paper);width:min(440px,100%);border-radius:14px;padding:32px 30px 28px;box-shadow:0 18px 50px rgba(20,30,35,.14);border:1px solid var(--rule)}
img{display:block;height:58px;width:auto;margin-bottom:22px}
h1{font-size:22px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 22px;color:var(--ink2);font-size:15px;line-height:1.5}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid #b9c2c5;border-radius:8px;outline:none}
input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,42,49,.12)}
button{width:100%;margin-top:14px;font:inherit;font-size:16px;font-weight:650;padding:12px;border:0;border-radius:8px;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.erro{color:var(--marca);font-size:14px;min-height:20px;margin:10px 0 0}
small{display:block;margin-top:18px;color:var(--ink2);font-size:12px;line-height:1.5}
</style>
</head>
